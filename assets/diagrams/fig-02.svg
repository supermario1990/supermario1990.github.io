<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 580" role="img" aria-label="epoll 内核结构：eventpoll、红黑树、就绪链表、epitem 与回调路径" class="diag" xmlns="http://www.w3.org/2000/svg" width="960" height="580">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.diag text{fill:#1b1e21}
.diag .ts{font-size:9.5px;fill:#5a636b}
.diag .t{font-size:11px}
.diag .tb{font-size:12.5px;font-weight:700}
.diag .tm{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px}
.diag .tw{fill:#ffffff}
.diag .ta{fill:#0f5f68}
.diag .to{fill:#a8541c}
.diag .th{fill:#9d2f2f}
</style>

            <defs>
              <marker id="ep-ar" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 z" fill="#5a636b"/>
              </marker>
              <marker id="ep-ar-a" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 z" fill="#0f5f68"/>
              </marker>
              <marker id="ep-ar-h" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 z" fill="#9d2f2f"/>
              </marker>
            </defs>

            <rect x="300" y="34" width="640" height="520" rx="10" fill="#f1ede4"/>
            <text x="924" y="54" text-anchor="end" class="ts">内核态</text>

            <rect x="20" y="34" width="250" height="200" rx="10" fill="none" stroke="#c9c1b2" stroke-dasharray="5 5"/>
            <text x="34" y="54" class="ts">用户态</text>

            <rect x="32" y="62" width="226" height="160" rx="8" fill="#ffffff" stroke="#ddd6c9"/>
            <text x="44" y="82" class="tb">用户态应用</text>
            <text x="44" y="106" class="tm ta">epoll_create1()</text>
            <text x="44" y="120" class="ts">创建 eventpoll 实例</text>
            <text x="44" y="144" class="tm ta">epoll_ctl()</text>
            <text x="44" y="158" class="ts">ADD / MOD / DEL</text>
            <text x="44" y="182" class="tm ta">epoll_wait()</text>
            <text x="44" y="196" class="ts">取走就绪事件数组</text>

            <!-- eventpoll -->
            <rect x="330" y="58" width="330" height="248" rx="8" fill="#ffffff" stroke="#0f5f68" stroke-opacity=".45"/>
            <text x="344" y="79" class="tm" font-weight="700">struct eventpoll</text>

            <rect x="344" y="90" width="160" height="150" rx="6" fill="none" stroke="#ddd6c9" stroke-dasharray="4 4"/>
            <text x="424" y="106" text-anchor="middle" class="ts">rbr · 红黑树</text>

            <line x1="424" y1="137" x2="392" y2="151" stroke="#b9b1a3"/>
            <line x1="424" y1="137" x2="456" y2="151" stroke="#b9b1a3"/>
            <line x1="392" y1="177" x2="368" y2="191" stroke="#b9b1a3"/>
            <line x1="392" y1="177" x2="416" y2="191" stroke="#b9b1a3"/>
            <circle cx="424" cy="124" r="13" fill="#e2efef" stroke="#0f5f68"/>
            <circle cx="392" cy="164" r="13" fill="#e2efef" stroke="#0f5f68"/>
            <circle cx="456" cy="164" r="13" fill="#e2efef" stroke="#0f5f68"/>
            <circle cx="368" cy="204" r="13" fill="#e2efef" stroke="#0f5f68"/>
            <circle cx="416" cy="204" r="13" fill="#e2efef" stroke="#0f5f68"/>
            <text x="424" y="128" text-anchor="middle" class="ts">epi</text>
            <text x="392" y="168" text-anchor="middle" class="ts">epi</text>
            <text x="456" y="168" text-anchor="middle" class="ts">epi</text>
            <text x="368" y="208" text-anchor="middle" class="ts">epi</text>
            <text x="416" y="208" text-anchor="middle" class="ts">epi</text>
            <text x="424" y="234" text-anchor="middle" class="ts">增删 O(log n)</text>

            <!-- rdllist -->
            <rect x="522" y="90" width="124" height="150" rx="6" fill="none" stroke="#9d2f2f" stroke-dasharray="4 4"/>
            <text x="584" y="106" text-anchor="middle" class="tb th">rdllist</text>
            <text x="584" y="120" text-anchor="middle" class="ts">就绪链表</text>
            <rect x="534" y="130" width="100" height="22" rx="3" fill="#f7e9dd" stroke="#e6c8ad"/>
            <text x="584" y="145" text-anchor="middle" class="ts">epitem</text>
            <rect x="534" y="160" width="100" height="22" rx="3" fill="#f7e9dd" stroke="#e6c8ad"/>
            <text x="584" y="175" text-anchor="middle" class="ts">epitem</text>
            <rect x="534" y="190" width="100" height="22" rx="3" fill="#f7e9dd" stroke="#e6c8ad"/>
            <text x="584" y="205" text-anchor="middle" class="ts">epitem</text>
            <text x="584" y="232" text-anchor="middle" class="ts">插入 O(1)</text>

            <text x="344" y="262" class="ts">wq · 等待 epoll_wait 的进程队列</text>
            <text x="344" y="278" class="ts">ovflist · 遍历期间的溢出暂存</text>
            <text x="344" y="294" class="ts">lock / mtx · 保护红黑树与链表</text>

            <!-- epitem -->
            <rect x="690" y="58" width="228" height="248" rx="8" fill="#ffffff" stroke="#a8541c" stroke-opacity=".45"/>
            <text x="704" y="79" class="tm" font-weight="700">struct epitem</text>
            <text x="704" y="95" class="ts">每个被监视的 fd 对应一项</text>
            <text x="704" y="118" class="t">rbn　　红黑树节点</text>
            <text x="704" y="140" class="t">rdllink　就绪链表节点</text>
            <text x="704" y="162" class="t">ffd　　{ fd, file * }</text>
            <text x="704" y="184" class="t">event　 { events, data }</text>
            <text x="704" y="206" class="t">pwqlist　等待队列项链表</text>
            <text x="704" y="236" class="ts">同一 epitem 在 rdllist 中只出现一次</text>

            <!-- socket -->
            <rect x="330" y="400" width="588" height="112" rx="8" fill="#ffffff" stroke="#ddd6c9"/>
            <text x="344" y="421" class="t">struct socket → struct sock → sk_wq（等待队列）</text>
            <rect x="344" y="434" width="170" height="44" rx="4" fill="#f8f6f1" stroke="#ddd6c9"/>
            <text x="356" y="452" class="ts">wait_queue_entry</text>
            <text x="356" y="468" class="ts th">ep_poll_callback</text>
            <rect x="530" y="434" width="170" height="44" rx="4" fill="#f8f6f1" stroke="#ddd6c9"/>
            <text x="542" y="452" class="ts">wait_queue_entry</text>
            <text x="542" y="468" class="ts th">ep_poll_callback</text>
            <rect x="716" y="434" width="170" height="44" rx="4" fill="#f8f6f1" stroke="#ddd6c9"/>
            <text x="728" y="452" class="ts">wait_queue_entry</text>
            <text x="728" y="468" class="ts th">ep_poll_callback</text>
            <text x="344" y="500" class="ts">每个 epitem 通过 eppoll_entry 挂一个回调项到目标文件的等待队列</text>

            <!-- 箭头 -->
            <line x1="258" y1="120" x2="326" y2="120" stroke="#5a636b" marker-end="url(#ep-ar)"/>
            <text x="292" y="111" text-anchor="middle" class="ts">epoll_ctl</text>

            <line x1="326" y1="196" x2="260" y2="196" stroke="#0f5f68" marker-end="url(#ep-ar-a)"/>
            <text x="292" y="187" text-anchor="middle" class="ts">wait 返回</text>

            <line x1="430" y1="306" x2="430" y2="396" stroke="#5a636b" stroke-dasharray="5 4" marker-end="url(#ep-ar)"/>
            <text x="420" y="352" text-anchor="end" class="ts">ep_insert()</text>

            <polyline points="620,397 620,330 584,330 584,244" fill="none" stroke="#9d2f2f" stroke-width="1.8" marker-end="url(#ep-ar-h)"/>
            <text x="632" y="348" class="ts th">ep_poll_callback()</text>
            <text x="632" y="362" class="ts th">挂入 rdllist → wake_up</text>

            <line x1="804" y1="306" x2="804" y2="396" stroke="#5a636b" stroke-dasharray="5 4" marker-end="url(#ep-ar)"/>
            <text x="812" y="356" class="ts">pwqlist</text>

            <!-- 图例 -->
            <line x1="330" y1="572" x2="366" y2="572" stroke="#5a636b" stroke-dasharray="5 4"/>
            <text x="374" y="576" class="ts">注册路径</text>
            <line x1="470" y1="572" x2="506" y2="572" stroke="#0f5f68"/>
            <text x="514" y="576" class="ts">返回路径</text>
            <line x1="610" y1="572" x2="646" y2="572" stroke="#9d2f2f" stroke-width="1.8"/>
            <text x="654" y="576" class="ts">就绪路径</text>
            <text x="800" y="576" class="ts">内核源码：fs/eventpoll.c</text>
          </svg>

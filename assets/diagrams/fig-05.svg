<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 430" role="img" aria-label="epoll 与 io_uring 处理同一批 IO 的系统调用次数对比" class="diag" xmlns="http://www.w3.org/2000/svg" width="960" height="430">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.diag text{fill:#1b1e21}
.diag .ts{font-size:9.5px;fill:#5a636b}
.diag .t{font-size:11px}
.diag .tb{font-size:12.5px;font-weight:700}
.diag .tm{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px}
.diag .tw{fill:#ffffff}
.diag .ta{fill:#0f5f68}
.diag .to{fill:#a8541c}
.diag .th{fill:#9d2f2f}
</style>

            <text x="40" y="32" class="ts">计数模型：1000 个连接各读一次、各写一次；不含 accept 与初始化</text>
            <line x1="40" y1="46" x2="920" y2="46" stroke="#e9e3d7"/>

            <text x="40" y="92" class="tb" font-size="14">epoll</text>
            <text x="40" y="110" class="ts">就绪通知</text>
            <line x1="260" y1="100" x2="720" y2="100" stroke="#ddd6c9"/>
            <circle cx="300" cy="100" r="5" fill="#0f5f68"/>
            <text x="300" y="124" class="ts" text-anchor="middle">epoll_wait ×1</text>
            <rect x="380" y="86" width="300" height="28" rx="4" fill="#f7e9dd" stroke="#e6c8ad"/>
            <text x="530" y="104" text-anchor="middle" class="ts">每个 fd 一次 recv + 一次 send</text>
            <text x="930" y="104" text-anchor="end" class="tb th" font-size="14">≈ 2001 次</text>
            <line x1="40" y1="156" x2="920" y2="156" stroke="#e9e3d7"/>

            <text x="40" y="192" class="tb" font-size="14">io_uring</text>
            <text x="40" y="210" class="ts">完成通知（默认）</text>
            <line x1="260" y1="200" x2="720" y2="200" stroke="#ddd6c9"/>
            <circle cx="300" cy="200" r="5" fill="#a8541c"/>
            <circle cx="380" cy="200" r="5" fill="#a8541c"/>
            <text x="300" y="224" class="ts" text-anchor="middle">enter ×1 提交读</text>
            <text x="380" y="224" class="ts" text-anchor="middle">enter ×1 提交写</text>
            <text x="470" y="224" class="ts">每批 1000 个 SQE 只需一次进入内核</text>
            <text x="930" y="204" text-anchor="end" class="tb ta" font-size="14">2 次</text>
            <line x1="40" y1="266" x2="920" y2="266" stroke="#e9e3d7"/>

            <text x="40" y="302" class="tb" font-size="13">io_uring + SQPOLL</text>
            <text x="40" y="320" class="ts">内核线程轮询 SQ</text>
            <line x1="260" y1="310" x2="720" y2="310" stroke="#c9c1b2" stroke-dasharray="6 5"/>
            <text x="490" y="314" text-anchor="middle" class="ts">提交侧没有系统调用，应用直接写共享环</text>
            <text x="260" y="338" class="ts">代价：内核线程持续占用一个 CPU 核，且需要相应权限</text>
            <text x="930" y="314" text-anchor="end" class="tb to" font-size="14">0 次</text>
            <line x1="40" y1="376" x2="920" y2="376" stroke="#e9e3d7"/>

            <text x="40" y="402" class="ts">系统调用次数只是开销的一部分：数据拷贝、协议栈处理、调度与设备效率同样决定最终吞吐。</text>
          </svg>

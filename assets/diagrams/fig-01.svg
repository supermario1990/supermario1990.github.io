<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 320" role="img" aria-label="select、poll、epoll、kqueue、io_uring 的演进时间线" class="diag" xmlns="http://www.w3.org/2000/svg" width="960" height="320">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.diag text{fill:#1b1e21}
.diag .ts{font-size:9.5px;fill:#5a636b}
.diag .t{font-size:11px}
.diag .tb{font-size:12.5px;font-weight:700}
.diag .tm{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px}
.diag .tw{fill:#ffffff}
.diag .ta{fill:#0f5f68}
.diag .to{fill:#a8541c}
.diag .th{fill:#9d2f2f}
</style>

            <defs>
              <marker id="tl-ar" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 z" fill="#b9b1a3"/>
              </marker>
            </defs>

            <rect x="36" y="26" width="304" height="24" rx="4" fill="#efebe2"/>
            <text x="188" y="42" text-anchor="middle" class="ts">1983–1995 · 位图与线性扫描</text>
            <rect x="350" y="26" width="372" height="24" rx="4" fill="#e2efef"/>
            <text x="536" y="42" text-anchor="middle" class="ts">1996–2018 · 就绪通知逐渐成熟</text>
            <rect x="732" y="26" width="192" height="24" rx="4" fill="#f7e9dd"/>
            <text x="828" y="42" text-anchor="middle" class="ts">2019– · 完成通知</text>

            <line x1="72" y1="160" x2="908" y2="160" stroke="#c9c1b2" stroke-width="1.5" marker-end="url(#tl-ar)"/>

            <!-- 1983 select -->
            <circle cx="80" cy="160" r="6" fill="#f8f6f1" stroke="#0f5f68" stroke-width="2.5"/>
            <line x1="80" y1="154" x2="80" y2="140" stroke="#c9c1b2"/>
            <text x="80" y="132" class="tm ta">1983</text>
            <text x="80" y="116" class="tb">select()</text>
            <text x="80" y="102" class="ts">4.2BSD：fd_set 位图</text>

            <!-- 1986 poll -->
            <circle cx="147" cy="160" r="6" fill="#f8f6f1" stroke="#0f5f68" stroke-width="2.5"/>
            <line x1="147" y1="166" x2="147" y2="176" stroke="#c9c1b2"/>
            <text x="147" y="190" class="tm ta">1986</text>
            <text x="147" y="206" class="tb">poll()</text>
            <text x="147" y="221" class="ts">System V；Linux 2.1.23</text>

            <!-- 1996 IOCP -->
            <circle cx="372" cy="160" r="6" fill="#f8f6f1" stroke="#a8541c" stroke-width="2.5"/>
            <line x1="372" y1="154" x2="372" y2="140" stroke="#c9c1b2"/>
            <text x="372" y="132" class="tm to">1996</text>
            <text x="372" y="116" class="tb">IOCP</text>
            <text x="372" y="102" class="ts">Windows NT：完成端口</text>

            <!-- 2000 kqueue -->
            <circle cx="462" cy="160" r="6" fill="#f8f6f1" stroke="#0f5f68" stroke-width="2.5"/>
            <line x1="462" y1="166" x2="462" y2="176" stroke="#c9c1b2"/>
            <text x="462" y="190" class="tm ta">2000</text>
            <text x="462" y="206" class="tb">kqueue()</text>
            <text x="462" y="221" class="ts">FreeBSD 4.1</text>

            <!-- 2002 epoll -->
            <circle cx="516" cy="160" r="7" fill="#0f5f68" stroke="#0f5f68"/>
            <line x1="516" y1="153" x2="516" y2="140" stroke="#c9c1b2"/>
            <text x="516" y="132" class="tm ta">2002</text>
            <text x="516" y="116" class="tb">epoll</text>
            <text x="516" y="102" class="ts">Linux 2.5.44</text>

            <!-- 2019 io_uring -->
            <circle cx="892" cy="160" r="7" fill="#a8541c" stroke="#a8541c"/>
            <line x1="892" y1="166" x2="892" y2="176" stroke="#c9c1b2"/>
            <text x="900" y="190" text-anchor="end" class="tm to">2019</text>
            <text x="900" y="206" text-anchor="end" class="tb">io_uring</text>
            <text x="900" y="221" text-anchor="end" class="ts">Linux 5.1 · Jens Axboe</text>

            <line x1="36" y1="262" x2="940" y2="262" stroke="#e9e3d7"/>
            <text x="36" y="284" class="ts">1999 · Dan Kegel 提出 C10K 问题</text>
            <text x="36" y="302" class="ts">C10M 不再是单一 API 能解决的问题：多队列网卡、批处理、SO_REUSEPORT、内核旁路（DPDK/SPDK）与 io_uring 组合使用</text>
          </svg>

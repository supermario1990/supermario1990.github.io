<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" role="img" aria-label="io_uring 的 SQ/CQ 环形队列与用户态内核态共享内存结构" class="diag" xmlns="http://www.w3.org/2000/svg" width="960" height="520">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.diag text{fill:#1b1e21}
.diag .ts{font-size:9.5px;fill:#5a636b}
.diag .t{font-size:11px}
.diag .tb{font-size:12.5px;font-weight:700}
.diag .tm{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px}
.diag .tw{fill:#ffffff}
.diag .ta{fill:#0f5f68}
.diag .to{fill:#a8541c}
.diag .th{fill:#9d2f2f}
</style>

            <defs>
              <marker id="ur-ar" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 z" fill="#5a636b"/>
              </marker>
            </defs>

            <text x="480" y="28" text-anchor="middle" class="ts">共享内存：同一块物理页同时映射到用户态与内核态，参数不需要来回拷贝</text>

            <!-- 用户提交 -->
            <rect x="24" y="52" width="260" height="174" rx="8" fill="#ffffff" stroke="#ddd6c9"/>
            <text x="38" y="74" class="tb">应用（用户态）</text>
            <text x="38" y="100" class="t">① 取一个空闲 SQE 槽位</text>
            <text x="38" y="122" class="t">② 填 opcode / fd / addr / len</text>
            <text x="38" y="144" class="t">③ tail++，进入内核提交</text>
            <text x="38" y="166" class="t">④ 从 CQ 收割完成结果</text>
            <text x="38" y="192" class="ts">通过 mmap 拿到环指针</text>
            <text x="38" y="208" class="ts">user_data 用来关联请求上下文</text>

            <!-- SQ -->
            <rect x="330" y="52" width="310" height="212" rx="8" fill="#ffffff" stroke="#0f5f68" stroke-opacity=".5"/>
            <text x="344" y="74" class="tb ta">SQ ring · 提交队列</text>

            <rect x="344" y="84" width="64" height="22" rx="3" fill="#e2efef"/>
            <text x="376" y="99" text-anchor="middle" class="ts">head</text>
            <rect x="414" y="84" width="64" height="22" rx="3" fill="#e2efef"/>
            <text x="446" y="99" text-anchor="middle" class="ts">tail</text>
            <rect x="484" y="84" width="64" height="22" rx="3" fill="#e2efef"/>
            <text x="516" y="99" text-anchor="middle" class="ts">ring_mask</text>
            <rect x="554" y="84" width="64" height="22" rx="3" fill="#e2efef"/>
            <text x="586" y="99" text-anchor="middle" class="ts">entries</text>

            <text x="344" y="126" class="ts">32 位单调递增计数器，下标 = 值 &amp; mask</text>
            <text x="344" y="146" class="ts">array[ ]：按提交顺序存放 SQE 下标</text>

            <rect x="344" y="154" width="32" height="20" rx="2" fill="#f1ede4" stroke="#ddd6c9"/>
            <text x="360" y="168" text-anchor="middle" class="ts">0</text>
            <rect x="382" y="154" width="32" height="20" rx="2" fill="#f1ede4" stroke="#ddd6c9"/>
            <text x="398" y="168" text-anchor="middle" class="ts">1</text>
            <rect x="420" y="154" width="32" height="20" rx="2" fill="#f1ede4" stroke="#ddd6c9"/>
            <text x="436" y="168" text-anchor="middle" class="ts">2</text>
            <rect x="458" y="154" width="32" height="20" rx="2" fill="#f1ede4" stroke="#ddd6c9"/>
            <text x="474" y="168" text-anchor="middle" class="ts">3</text>
            <rect x="496" y="154" width="32" height="20" rx="2" fill="#f1ede4" stroke="#ddd6c9"/>
            <text x="512" y="168" text-anchor="middle" class="ts">4</text>
            <text x="542" y="168" class="ts">…</text>

            <text x="344" y="196" class="t">SQE 数组：64 B × entries</text>
            <text x="344" y="212" class="tm ta">mmap(IORING_OFF_SQES)</text>
            <text x="344" y="236" class="ts">应用推进 tail；内核推进 head</text>

            <!-- CQ -->
            <rect x="330" y="292" width="310" height="196" rx="8" fill="#ffffff" stroke="#a8541c" stroke-opacity=".5"/>
            <text x="344" y="314" class="tb to">CQ ring · 完成队列</text>

            <rect x="344" y="324" width="64" height="22" rx="3" fill="#f7e9dd"/>
            <text x="376" y="339" text-anchor="middle" class="ts">head</text>
            <rect x="414" y="324" width="64" height="22" rx="3" fill="#f7e9dd"/>
            <text x="446" y="339" text-anchor="middle" class="ts">tail</text>
            <rect x="484" y="324" width="64" height="22" rx="3" fill="#f7e9dd"/>
            <text x="516" y="339" text-anchor="middle" class="ts">ring_mask</text>
            <rect x="554" y="324" width="64" height="22" rx="3" fill="#f7e9dd"/>
            <text x="586" y="339" text-anchor="middle" class="ts">overflow</text>

            <text x="344" y="366" class="ts">内核推进 tail；应用读 head 并归还槽位</text>
            <text x="344" y="392" class="t">CQE 数组：16 B × entries</text>
            <text x="344" y="408" class="tm to">mmap(IORING_OFF_CQ_RING)</text>

            <rect x="344" y="418" width="92" height="26" rx="3" fill="#f8f6f1" stroke="#ddd6c9"/>
            <text x="390" y="435" text-anchor="middle" class="ts">user_data</text>
            <rect x="442" y="418" width="92" height="26" rx="3" fill="#f8f6f1" stroke="#ddd6c9"/>
            <text x="488" y="435" text-anchor="middle" class="ts">res</text>
            <rect x="540" y="418" width="92" height="26" rx="3" fill="#f8f6f1" stroke="#ddd6c9"/>
            <text x="586" y="435" text-anchor="middle" class="ts">flags</text>

            <!-- 用户收割 -->
            <rect x="24" y="330" width="260" height="130" rx="8" fill="#ffffff" stroke="#ddd6c9"/>
            <text x="38" y="352" class="tb">应用收割</text>
            <text x="38" y="376" class="t">① 比较 CQ 的 head 与 tail</text>
            <text x="38" y="396" class="t">② 取 CQE：res + user_data</text>
            <text x="38" y="416" class="t">③ head++ 归还槽位</text>
            <text x="38" y="440" class="ts">读取是纯内存操作，无需 syscall</text>

            <!-- 内核 -->
            <rect x="680" y="52" width="250" height="436" rx="8" fill="#f1ede4" stroke="#ddd6c9"/>
            <text x="694" y="74" class="tb">内核侧 io_uring</text>

            <rect x="694" y="86" width="222" height="48" rx="5" fill="#ffffff" stroke="#ddd6c9"/>
            <text x="706" y="105" class="tm">io_uring_enter()</text>
            <text x="706" y="121" class="ts">批量取走 SQE</text>

            <rect x="694" y="148" width="222" height="48" rx="5" fill="#ffffff" stroke="#ddd6c9"/>
            <text x="706" y="167" class="t">inline 尝试</text>
            <text x="706" y="183" class="ts">非阻塞能完成就直接做</text>

            <rect x="694" y="210" width="222" height="48" rx="5" fill="#ffffff" stroke="#ddd6c9"/>
            <text x="706" y="229" class="t">poller</text>
            <text x="706" y="245" class="ts">pollable fd 就绪后重试</text>

            <rect x="694" y="272" width="222" height="64" rx="5" fill="#ffffff" stroke="#ddd6c9"/>
            <text x="706" y="291" class="t">io-wq 异步 worker</text>
            <text x="706" y="307" class="ts">可能阻塞的操作：文件、</text>
            <text x="706" y="323" class="ts">open、fsync、部分文件系统</text>

            <rect x="694" y="350" width="222" height="48" rx="5" fill="#ffffff" stroke="#0f5f68" stroke-opacity=".4"/>
            <text x="706" y="369" class="t">写回 CQE</text>
            <text x="706" y="385" class="ts">res + user_data，推进 tail</text>

            <text x="694" y="424" class="ts">下层：块层 / 协议栈 / 文件系统</text>
            <text x="694" y="444" class="ts">SQPOLL 模式由内核线程轮询 SQ，</text>
            <text x="694" y="460" class="ts">应用不再需要每次调用 enter</text>
            <text x="694" y="478" class="ts">完成事件可批量收割</text>

            <!-- 跨列箭头 -->
            <line x1="284" y1="130" x2="326" y2="130" stroke="#5a636b" marker-end="url(#ur-ar)"/>
            <text x="305" y="120" text-anchor="middle" class="ts">提交</text>

            <line x1="640" y1="112" x2="676" y2="112" stroke="#5a636b" marker-end="url(#ur-ar)"/>
            <text x="658" y="102" text-anchor="middle" class="ts">消费</text>

            <line x1="676" y1="374" x2="644" y2="374" stroke="#5a636b" marker-end="url(#ur-ar)"/>
            <text x="660" y="364" text-anchor="middle" class="ts">完成</text>

            <line x1="326" y1="400" x2="290" y2="400" stroke="#5a636b" marker-end="url(#ur-ar)"/>
            <text x="307" y="390" text-anchor="middle" class="ts">reap</text>

            <text x="24" y="504" class="ts">SQ 与 CQ 都是单生产者/单消费者：应用只推进 SQ tail 与 CQ head，内核只推进 SQ head 与 CQ tail。</text>
          </svg>

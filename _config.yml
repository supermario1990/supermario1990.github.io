# Hexo 站点配置
# 文档：https://hexo.io/docs/configuration

title: supermario1990 知识库
subtitle: 技术深度写作与沉淀
description: 把零散的深度研究沉淀成可回看的文章：一次讲透一个主题，配图、对比与选型建议。
keywords: Linux, IO 模型, epoll, io_uring, 性能优化
author: supermario1990
language: zh-CN
timezone: Asia/Shanghai

url: https://supermario1990.github.io
root: /
permalink: articles/:title.html
permalink_defaults:

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: 未分类
category_map:
tag_map:

date_format: YYYY-MM-DD
time_format: HH:mm:ss

theme: fluid

deploy:
  type: git
  repo: git@github.com:supermario1990/supermario1990.github.io.git
  branch: main
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
